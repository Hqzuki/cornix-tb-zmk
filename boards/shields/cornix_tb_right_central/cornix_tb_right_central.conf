# Cornix RIGHT half = split central. It owns the host connection (BLE + USB),
# ZMK Studio, the keymap, its own keys/encoder and the pointer pipeline. The
# left half and the XIAO trackball connect to it as peripherals.
CONFIG_ZMK_KEYBOARD_NAME="Crorb_right"
# Names the host shows (Bluetooth name follows ZMK_KEYBOARD_NAME, and so does
# the USB product string at the pinned ZMK); replace "ZMK Project" everywhere.
CONFIG_USB_DEVICE_MANUFACTURER="Crorb"
CONFIG_BT_DIS_MANUF_NAME_STR="Crorb"

# The board defconfig is written for a peripheral (central=n, USB off); undo that.
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_USB=y
# Two peripherals: the left half and the XIAO trackball.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=0
# 5 host profiles + 2 peripherals.
CONFIG_BT_MAX_CONN=7
CONFIG_BT_MAX_PAIRED=7

# Pointer events arrive from the XIAO through ZMK's input split.
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y

CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# Battery of both peripherals is fetched and proxied to the host.
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# Deep Sleep after five minutes without keys or pointer movement (any input
# event counts as activity). The right half wakes on its own keys only.
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# BLE lag fix (kept from the XIAO-central design, now applied to the right):
# +8 dBm instead of 0 dBm so the host link does not need retransmissions.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
# Ask the host for 7.5-11.25 ms (default max 15 ms) so pointer reports go out sooner.
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=9
# Split links at 11.25 ms (default 7.5 ms) leave more radio time for the host link.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=9

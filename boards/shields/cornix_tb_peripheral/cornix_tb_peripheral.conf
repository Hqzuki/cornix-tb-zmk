# Right Cornix now sends keys/encoder events to the XIAO central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_STUDIO=n
# The board-level Cornix keymap is also used by the peripheral build.
# Keep pointing behaviors available even though the XIAO is the sensor host.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
# Cornix Left and Right peripherals transmit at +2 dBm.
CONFIG_BT_CTLR_TX_PWR_PLUS_2=y
# Limit the peripheral radio PHY to LE 1M (disable LE 2M support).
CONFIG_BT_CTLR_PHY_2M=n

# Cornix LEFT half = split peripheral of the Cornix right central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
CONFIG_ZMK_USB=n
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=n
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=n
# The left half transmits at +2 dBm.
CONFIG_BT_CTLR_TX_PWR_PLUS_2=y
# Limit the peripheral radio PHY to LE 1M (disable LE 2M support).
CONFIG_BT_CTLR_PHY_2M=n

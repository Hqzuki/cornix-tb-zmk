# XIAO BLE trackball = split PERIPHERAL of the Cornix right half. It only runs
# the PAW3222 driver and forwards pointer events (ZMK input split); no keymap,
# no host connection, no USB HID.
CONFIG_ZMK_KEYBOARD_NAME="Crorb_tb"
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
# ZMK_USB depends on being a central/non-split device; force it off here.
CONFIG_ZMK_USB=n
CONFIG_ZMK_STUDIO=n
CONFIG_ZMK_POINTING=y
CONFIG_INPUT=y
# Onboard RGB LED is driven through PWM (battery/charging indicator).
CONFIG_PWM=y
CONFIG_PWM_NRFX=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# System OFF after five minutes without ball movement (input events count as
# activity). MOTION wakes/reboots the XIAO; the right half's keys do not.
CONFIG_ZMK_IDLE_TIMEOUT=300000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Keep the +8 dBm radio power of the old XIAO-central build for the link to the
# right half (connection interval is chosen by the central: 11.25 ms, latency 0).
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Allow the LE 2M PHY so each input notification is shorter on air. The input
# queue stays at ZMK's default (32): a short queue dropped motion and made small,
# fine movements jumpy.
CONFIG_BT_CTLR_PHY_2M=y

# SPDX-License-Identifier: MIT
# Three-wire half-duplex SDIO, with signal roles detected at every boot.
description: Cornix PAW3222 optical sensor with GPIO three-wire transport
compatible: "cornix,paw3222-gpio"
include: base.yaml
properties:
  autodetect-gpios:
    type: phandle-array
    required: true
    description: Exactly four signal GPIOs to permute as SCK, SDIO, NCS and MOTION
  poll-interval-ms:
    type: int
    default: 15
  res-cpi:
    type: int
    default: 1216
    description: Resolution in multiples of 38 CPI, from 608 to 4826
  deadzone:
    type: int
    default: 1
    description: Per-axis raw-count deadzone; sub-threshold deltas are accumulated and cancelling jitter is discarded
  batch-ms:
    type: int
    default: 0
    description: Hold slow motion up to this many ms so X and Y are sent together (0 = off)
  batch-counts:
    type: int
    default: 0
    description: Send at once when |dx|+|dy| reaches this many counts
